<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FM Signal">
<title>FM Audio Signal Generator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:20px;background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none}
.container{max-width:420px;margin:auto;background:#fff;padding:20px;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
h3{margin:10px 0;color:#333;border-bottom:2px solid #eee;padding-bottom:5px}
.freq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{border:0;border-radius:10px;padding:15px 5px;font-size:16px;font-weight:bold;background:#007aff;color:#fff}
button.active{background:#28a745} button:active{transform:scale(.96)}
.level{text-align:center;margin:25px 0}
#db-display{font-size:60px;font-weight:bold;color:#222}.unit{font-size:22px;color:#666}
.ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ctrl{background:#6c757d}
.channel{margin-top:25px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chbtn.off{background:#777}.chbtn.on{background:#28a745}
.stop{margin-top:25px;width:100%;background:#dc3545;font-size:20px}
.info{margin-top:15px;text-align:center;color:#666;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<h3>Frequency (Hz)</h3>
<div class="freq-grid" id="freq-grid"></div>
<div class="level"><span id="db-display">0.0</span><span class="unit"> dB</span></div>
<div class="ctrl-grid">
<button class="ctrl" onclick="adjustLevel(1)">+1.0</button>
<button class="ctrl" onclick="adjustLevel(-1)">-1.0</button>
<button class="ctrl" onclick="adjustLevel(.1)">+0.1</button>
<button class="ctrl" onclick="adjustLevel(-.1)">-0.1</button>
</div>
<h3>Channel Output</h3>
<div class="channel">
<button id="l-btn" class="chbtn on" onclick="toggleChannel('L')">L : ON</button>
<button id="r-btn" class="chbtn on" onclick="toggleChannel('R')">R : ON</button>
</div>
<button class="stop" onclick="stopAudio()">STOP</button>
<div class="info">Independent L/R oscillator test version<br>7.5k = 7500 Hz</div>
</div>
<script>
const frequencies=[
 {label:"50",hz:50},{label:"100",hz:100},{label:"400",hz:400},
 {label:"1k",hz:1000},{label:"3k",hz:3000},{label:"5k",hz:5000},
 {label:"7.5k",hz:7500},{label:"10k",hz:10000},{label:"15k",hz:15000}
];

let audioCtx=null, selected=null, currentDb=0;
let lOn=true, rOn=true;
let lOsc=null, rOsc=null, lGain=null, rGain=null, merger=null;

const grid=document.getElementById("freq-grid");
frequencies.forEach(item=>{
 const b=document.createElement("button");
 b.textContent=item.label+"Hz";
 b.id="btn-"+item.label;
 b.onclick=()=>selectFrequency(item);
 grid.appendChild(b);
});

async function initAudio(){
 if(!audioCtx){
   const AC=window.AudioContext||window.webkitAudioContext;
   audioCtx=new AC({latencyHint:"interactive"});
 }
 if(audioCtx.state!=="running") await audioCtx.resume();
}

function amp(){ return Math.pow(10,currentDb/20); }

function makeOsc(channel){
 const o=audioCtx.createOscillator();
 const g=audioCtx.createGain();
 o.type="sine";
 o.frequency.setValueAtTime(selected.hz,audioCtx.currentTime);
 g.gain.setValueAtTime(amp(),audioCtx.currentTime);
 o.connect(g);
 if(channel==="L") g.connect(merger,0,0);
 else g.connect(merger,0,1);
 o.start();
 if(channel==="L"){lOsc=o;lGain=g;} else {rOsc=o;rGain=g;}
}

function kill(channel){
 let o=channel==="L"?lOsc:rOsc;
 let g=channel==="L"?lGain:rGain;
 if(o){try{o.stop()}catch(e){} try{o.disconnect()}catch(e){}}
 if(g){try{g.disconnect()}catch(e){}}
 if(channel==="L"){lOsc=null;lGain=null;} else {rOsc=null;rGain=null;}
}

async function selectFrequency(item){
 await initAudio();
 if(selected) document.getElementById("btn-"+selected.label)?.classList.remove("active");
 selected=item;
 document.getElementById("btn-"+item.label).classList.add("active");
 rebuild();
}

function rebuild(){
 kill("L"); kill("R");
 if(merger){try{merger.disconnect()}catch(e){}}
 if(!selected||!audioCtx) return;
 merger=audioCtx.createChannelMerger(2);
 merger.connect(audioCtx.destination);
 if(lOn) makeOsc("L");
 if(rOn) makeOsc("R");
}

function toggleChannel(ch){
 if(ch==="L"){lOn=!lOn; if(lOn&&selected) makeOsc("L"); else kill("L");}
 else {rOn=!rOn; if(rOn&&selected) makeOsc("R"); else kill("R");}
 updateButtons();
}

function updateButtons(){
 const lb=document.getElementById("l-btn"), rb=document.getElementById("r-btn");
 lb.textContent="L : "+(lOn?"ON":"OFF"); lb.className="chbtn "+(lOn?"on":"off");
 rb.textContent="R : "+(rOn?"ON":"OFF"); rb.className="chbtn "+(rOn?"on":"off");
}

function adjustLevel(v){
 const n=Math.round((currentDb+v)*10)/10;
 if(n<-20||n>0) return;
 currentDb=n;
 document.getElementById("db-display").textContent=n===0?"0.0":n.toFixed(1);
 const now=audioCtx?audioCtx.currentTime:0;
 if(lGain) lGain.gain.setValueAtTime(amp(),now);
 if(rGain) rGain.gain.setValueAtTime(amp(),now);
}

function stopAudio(){
 kill("L"); kill("R");
 if(merger){try{merger.disconnect()}catch(e){} merger=null;}
 if(selected) document.getElementById("btn-"+selected.label)?.classList.remove("active");
 selected=null;
}

document.addEventListener("visibilitychange",async()=>{
 if(document.visibilityState==="visible"&&audioCtx) await audioCtx.resume();
});
</script>
</body>
</html>
