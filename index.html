<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FM Signal">
<title>FM Audio Signal Generator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:20px;background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none}
.container{max-width:420px;margin:auto;background:#fff;padding:20px;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
h3{margin:10px 0;color:#333;border-bottom:2px solid #eee;padding-bottom:5px}
.freq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{border:0;border-radius:10px;padding:15px 5px;font-size:16px;font-weight:bold;background:#007aff;color:#fff}
button.active{background:#28a745} button:active{transform:scale(.96)}
.level{text-align:center;margin:25px 0}
#db-display{font-size:60px;font-weight:bold}.unit{font-size:22px;color:#666}
.ctrl-grid,.channel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctrl{background:#6c757d}.channel{margin-top:15px}
.chbtn.on{background:#28a745}.chbtn.off{background:#777}
.stop{margin-top:25px;width:100%;background:#dc3545;font-size:20px}
</style>
</head>
<body>
<div class="container">
<h3>Frequency (Hz)</h3>
<div class="freq-grid" id="freq-grid"></div>
<div class="level"><span id="db-display">0.0</span><span class="unit"> dBm</span></div>
<div class="ctrl-grid">
<button class="ctrl" onclick="adjustLevel(10)">+10.0</button>
<button class="ctrl" onclick="adjustLevel(-10)">-10.0</button>
<button class="ctrl" onclick="adjustLevel(5)">+5.0</button>
<button class="ctrl" onclick="adjustLevel(-5)">-5.0</button>
<button class="ctrl" onclick="adjustLevel(1)">+1.0</button>
<button class="ctrl" onclick="adjustLevel(-1)">-1.0</button>
<button class="ctrl" onclick="adjustLevel(.1)">+0.1</button>
<button class="ctrl" onclick="adjustLevel(-.1)">-0.1</button>
</div>
<h3>Channel Output</h3>
<div class="channel">
<button id="l-btn" class="chbtn on" onclick="toggleChannel('L')">L : ON</button>
<button id="r-btn" class="chbtn on" onclick="toggleChannel('R')">R : ON</button>
</div>
<button class="stop" onclick="stopAudio()">STOP</button>
</div>
<script>
const frequencies=[
 {label:"50",hz:50},{label:"100",hz:100},{label:"200",hz:200},
 {label:"400",hz:400},{label:"700",hz:700},{label:"1k",hz:1000},
 {label:"1.5k",hz:1500},{label:"3k",hz:3000},{label:"5k",hz:5000},
 {label:"7.5k",hz:7500},{label:"10k",hz:10000},{label:"15k",hz:15000}
];

let ctx=null, source=null, selected=null;
let currentDbm=0, lOn=true, rOn=true;
const calibrationDb=9.1; // measured: digital -9.1 dB = 0 dBm
const sampleRate=48000;
const duration=2;

const grid=document.getElementById("freq-grid");
frequencies.forEach(item=>{
 const b=document.createElement("button");
 b.textContent=item.label+"Hz";
 b.id="btn-"+item.label;
 b.onclick=()=>selectFrequency(item);
 grid.appendChild(b);
});

async function initAudio(){
 if(!ctx){
   const AC=window.AudioContext||window.webkitAudioContext;
   ctx=new AC({sampleRate:sampleRate,latencyHint:"interactive"});
 }
 if(ctx.state!=="running") await ctx.resume();
}

function createStereoBuffer(freq){
 const frames=Math.round(ctx.sampleRate*duration);
 const buffer=ctx.createBuffer(2,frames,ctx.sampleRate);
 const left=buffer.getChannelData(0);
 const right=buffer.getChannelData(1);
 const digitalDb=currentDbm-calibrationDb;
 const gain=Math.pow(10,digitalDb/20);
 for(let i=0;i<frames;i++){
   const s=Math.sin(2*Math.PI*freq*i/ctx.sampleRate)*gain;
   left[i]=lOn?s:0.0;
   right[i]=rOn?s:0.0;
 }
 return buffer;
}

function stopSource(){
 if(source){
   try{source.stop()}catch(e){}
   try{source.disconnect()}catch(e){}
   source=null;
 }
}
function rebuild(){
 stopSource();
 if(!selected||!ctx)return;
 source=ctx.createBufferSource();
 source.buffer=createStereoBuffer(selected.hz);
 source.loop=true;
 source.connect(ctx.destination);
 source.start();
}
async function selectFrequency(item){
 await initAudio();
 if(selected)document.getElementById("btn-"+selected.label)?.classList.remove("active");
 selected=item;
 document.getElementById("btn-"+item.label).classList.add("active");
 rebuild();
}
function toggleChannel(ch){
 if(ch==="L")lOn=!lOn; else rOn=!rOn;
 updateButtons();
 if(selected)rebuild();
}
function updateButtons(){
 const lb=document.getElementById("l-btn"),rb=document.getElementById("r-btn");
 lb.textContent="L : "+(lOn?"ON":"OFF");
 rb.textContent="R : "+(rOn?"ON":"OFF");
 lb.className="chbtn "+(lOn?"on":"off");
 rb.className="chbtn "+(rOn?"on":"off");
}
function adjustLevel(v){
 let n=Math.round((currentDbm+v)*10)/10;
 if(n>9.1)n=9.1;
 if(n<-10.0)n=-10.0;
 currentDbm=n;
 document.getElementById("db-display").textContent=(n>0?"+":"")+n.toFixed(1);
 if(selected)rebuild();
}
function stopAudio(){
 stopSource();
 if(selected)document.getElementById("btn-"+selected.label)?.classList.remove("active");
 selected=null;
}
document.addEventListener("visibilitychange",async()=>{
 if(document.visibilityState==="visible"&&ctx)await ctx.resume();
});
</script>
</body>
</html>
